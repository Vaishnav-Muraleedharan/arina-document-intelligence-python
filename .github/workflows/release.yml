# Versioning, changelog and publishing in ONE workflow file.
#
# Why one file: PyPI Trusted Publishing identifies the publisher by the workflow filename
# and refuses reusable (called) workflows. Two GitHub rules also shape this:
#   - events created with the workflow's own GITHUB_TOKEN never start other workflows, so
#     the GitHub Release that release-please creates cannot trigger a separate workflow;
#   - therefore the publish jobs live here and run in the same run, gated on the
#     `release_created` output.
#
# Normal path (push to main):
#   release-please -> opens/updates "chore(main): release x.y.z"     (nothing else runs)
#   ...that PR is merged...
#   release-please -> tags vX.Y.Z + GitHub Release -> build -> publish  (all in one run)
#
# Manual path (Actions -> Release -> Run workflow): build a tag (or the default branch)
# and publish it to the chosen index. Use it to bootstrap the first version or to upload
# a version that was tagged but failed to publish.
#
# Target index for automatic publishes is FAIL-SAFE: TestPyPI unless the repository
# variable RELEASE_INDEX is exactly "pypi" (Settings -> Secrets and variables -> Actions
# -> Variables). A missing or mistyped variable can never publish to the real index.
#
# One-time setup on each index (https://pypi.org / https://test.pypi.org):
#   Project (or Account, for a pending publisher) -> Publishing -> add a GitHub publisher:
#     PyPI project name : arina-document-intelligence
#     Owner             : <GitHub user or org>
#     Repository name   : arina-document-intelligence-python
#     Workflow name     : release.yml          <- this file
#     Environment name  : testpypi   on TestPyPI  /  pypi   on PyPI
#   In GitHub: Settings -> Environments -> create "testpypi" and "pypi". A required
#   reviewer on "pypi" gives a human approval gate before every real publish.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      index:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      ref:
        description: Tag to build (e.g. v0.1.2). Empty = default branch, no tag check.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create tag + GitHub Release
      pull-requests: write   # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # `!cancelled()` lets this run when release-please was skipped (manual dispatch).
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      ) }}
    runs-on: ubuntu-latest
    outputs:
      index: ${{ steps.target.outputs.index }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || needs.release-please.outputs.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Decide target index and verify version matches the tag
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_INDEX: ${{ inputs.index }}
          INPUT_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_INDEX: ${{ vars.RELEASE_INDEX }}
        run: |
          set -eu
          version="$(python - <<'EOF'
          import re, pathlib
          print(re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path("pyproject.toml").read_text(), re.M).group(1))
          EOF
          )"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            index="$INPUT_INDEX"; tag="$INPUT_REF"
          else
            # Fail-safe: only an explicit "pypi" reaches the real index.
            if [ "$RELEASE_INDEX" = "pypi" ]; then index="pypi"; else index="testpypi"; fi
            tag="$RELEASE_TAG"
          fi

          if [ -n "$tag" ] && [ "${tag#v}" != "$version" ]; then
            echo "::error::tag $tag does not match package version $version"; exit 1
          fi

          {
            echo "version=$version"
            echo "index=$index"
          } >> "$GITHUB_OUTPUT"
          echo "### Publish plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`$version\`  tag: \`${tag:-none}\`  index: **$index**" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: needs.build.outputs.index == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/arina-document-intelligence/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: needs.build.outputs.index == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/arina-document-intelligence/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
