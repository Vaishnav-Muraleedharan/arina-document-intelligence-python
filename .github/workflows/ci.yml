# Runs on every pull request and on main. Lint what we write, test the wire contract and
# the helpers, and prove the package builds and its metadata is publishable.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject (requires-python) and a current release.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint (our code only; generated code is replaced on import)
        run: ruff check

      - name: Format check
        run: ruff format --check

      - name: Test
        run: pytest

  build:
    name: build & check metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Check metadata renders on PyPI
        run: twine check --strict dist/*

      - name: Installed package imports and reports its version
        run: |
          python -m pip install dist/*.whl
          python -c "import arina_document_intelligence as a, arina_document_intelligence.lib; print(a.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
