# Build once, publish via PyPI Trusted Publishing (OIDC). No API tokens are stored anywhere.
#
# Triggers:
#   - a GitHub Release is published (release-please does this when its PR is merged)
#       -> publishes to PyPI
#   - manual run (Actions tab -> Publish -> Run workflow)
#       -> publishes to TestPyPI by default, or PyPI if you pick it
#
# One-time setup on each index (https://pypi.org / https://test.pypi.org):
#   Your account -> Publishing -> "Add a new pending publisher":
#     PyPI project name : arina-document-intelligence
#     Owner             : <your GitHub user or org>
#     Repository name   : arina-document-intelligence-python
#     Workflow name     : publish.yml
#     Environment name  : pypi   (or testpypi for TestPyPI)
#   Then in GitHub: Settings -> Environments -> create "pypi" and "testpypi". Adding
#   yourself as a required reviewer on "pypi" gives a manual approval gate before publish.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      index:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Version in the package matches the tag
        if: github.event_name == 'release'
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          built="$(python - <<'EOF'
          import re, pathlib
          print(re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path("pyproject.toml").read_text(), re.M).group(1))
          EOF
          )"
          echo "tag=$tag built=$built"
          test "$tag" = "$built"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/arina-document-intelligence
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.index == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arina-document-intelligence
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
