# Build once, publish via PyPI Trusted Publishing (OIDC). No API tokens are stored anywhere.
#
# How it gets run:
#   - Called by release-please.yml right after it creates a release (the normal path).
#     GitHub does not fire `on: release` for releases created with the workflow token, so
#     the release workflow calls this one directly instead.
#   - A human publishes a GitHub Release by hand (e.g. bootstrapping v0.1.0). Human-created
#     releases do trigger `on: release`, so that path works too.
#   - Manual run (Actions -> Publish -> Run workflow): TestPyPI by default, PyPI if chosen;
#     optionally a tag to build instead of the default branch.
#
# Target index for release publishes: PyPI, unless the repository variable RELEASE_INDEX
# is "testpypi" (Settings -> Secrets and variables -> Actions -> Variables). Set it while
# rehearsing the release loop; delete it (or set "pypi") to go live.
#
# One-time setup on each index (https://pypi.org / https://test.pypi.org):
#   Account -> Publishing -> "Add a new pending publisher":
#     PyPI project name : arina-document-intelligence
#     Owner             : <your GitHub user or org>
#     Repository name   : arina-document-intelligence-python
#     Workflow name     : publish.yml      <- this file, also when called from release-please.yml
#     Environment name  : pypi   (or testpypi for TestPyPI)
#   Then in GitHub: Settings -> Environments -> create "pypi" and "testpypi". Adding
#   yourself as a required reviewer on "pypi" gives a manual approval gate before publish.
name: Publish

on:
  workflow_call:
    inputs:
      ref:
        description: Tag to build and publish (e.g. v0.2.0)
        type: string
        required: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      index:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      ref:
        description: Tag or branch to build (empty = default branch)
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      index: ${{ steps.target.outputs.index }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Decide target index and verify version matches the tag
        id: target
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_INDEX: ${{ inputs.index }}
          RELEASE_INDEX: ${{ vars.RELEASE_INDEX }}
        run: |
          set -eu
          version="$(python - <<'EOF'
          import re, pathlib
          print(re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path("pyproject.toml").read_text(), re.M).group(1))
          EOF
          )"

          # Manual runs choose the index explicitly; release paths follow RELEASE_INDEX.
          if [ -n "${INPUT_INDEX}" ]; then index="${INPUT_INDEX}"
          elif [ "${RELEASE_INDEX}" = "testpypi" ]; then index="testpypi"
          else index="pypi"; fi

          # A release must publish exactly the version its tag names.
          tag=""
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then tag="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then tag="${INPUT_REF}"; fi
          if [ -n "${tag}" ] && [ "${tag#v}" != "${version}" ]; then
            echo "::error::tag ${tag} does not match package version ${version}"; exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "index=${index}" >> "$GITHUB_OUTPUT"
          echo "will publish ${version} to ${index} (tag: ${tag:-none})"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: needs.build.outputs.index == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/arina-document-intelligence/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: needs.build.outputs.index == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/arina-document-intelligence/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
