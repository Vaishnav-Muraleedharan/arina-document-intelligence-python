# Versioning and changelog, driven by Conventional Commits on main.
#
# release-please keeps ONE pull request open ("chore(main): release x.y.z") that bumps the
# version in pyproject.toml and _version.py and updates CHANGELOG.md from the commits
# since the last tag. Merging that PR creates the git tag and a GitHub Release, which is
# what triggers publish.yml.
#
# Commit prefixes that matter:  feat: -> minor,  fix: -> patch,  feat!: / BREAKING CHANGE -> major
# (while 0.x, majors are held to minors; see release-please-config.json).
#
# Note: PRs opened with the default GITHUB_TOKEN do not trigger other workflows, so CI
# does not run on the release PR itself. That is fine: it only touches version files.
# Use a fine-grained PAT in `token:` if you want CI on it.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
