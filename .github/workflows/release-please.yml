# Versioning, changelog and publishing, driven by Conventional Commits on main.
#
# release-please keeps ONE pull request open ("chore(main): release x.y.z") that bumps the
# version in pyproject.toml and _version.py and updates CHANGELOG.md from the commits
# since the last tag. Merging that PR makes the next run of this workflow create the git
# tag and a GitHub Release, and then publish the package by calling publish.yml.
#
# Why publish is called from here instead of `on: release` in publish.yml: GitHub never
# fires workflows for events created with the workflow's own GITHUB_TOKEN, and that is the
# token release-please uses to create the release. Chaining on the `release_created`
# output is the documented, token-free way around it.
#
# Commit prefixes that matter:  feat: -> minor,  fix: -> patch,  feat!: / BREAKING CHANGE -> major
# (while 0.x, majors are held to minors; see release-please-config.json).
#
# Note: PRs opened with the default GITHUB_TOKEN do not trigger other workflows, so CI
# does not run on the release PR itself. That is fine: it only touches version files.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    # Only on the run that just cut a release; the run that opens/updates the release PR
    # has release_created unset.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      id-token: write   # forwarded to publish.yml for Trusted Publishing
