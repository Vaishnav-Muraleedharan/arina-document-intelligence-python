# Preserved file: generated once by Scalar, then owned here. scripts/import_sdk.py never
# overwrites it; it prints a diff when the generated version changes (e.g. a new runtime
# dependency) so the change can be ported by hand.

[project]
name = "arina-document-intelligence"
version = "0.1.2" # x-release-please-version
description = "Python SDK for the Arina Document Intelligence API: schema-driven extraction with spatial citations, layout parsing, and reusable extractors."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Arina" },
]
requires-python = ">= 3.9"
keywords = ["arina", "document-intelligence", "ocr", "extraction", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.23.0, <1",
  "pydantic>=1.9.0, <3",
  "typing-extensions>=4.14, <5",
  "anyio>=3.5.0, <5",
  "distro>=1.7.0, <2",
  "sniffio",
]

[project.urls]
Homepage = "https://arina.ai"
Repository = "https://github.com/Vaishnav-Muraleedharan/arina-document-intelligence-python"
Changelog = "https://github.com/Vaishnav-Muraleedharan/arina-document-intelligence-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
aiohttp = ["aiohttp", "httpx_aiohttp>=0.1.9"]
# Tooling for this repository, not for SDK users.
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=6.1",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arina_document_intelligence"]

[tool.hatch.build.targets.sdist]
# Ship only what a consumer needs; repo tooling stays out of the tarball.
include = [
  "src/arina_document_intelligence",
  "README.md",
  "LICENSE",
  "api.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# tests/smoke-test.py is Scalar's live smoke test; it needs a real server and is run
# by hand, never collected here (its name does not match test_*.py anyway).

[tool.ruff]
line-length = 120
# Lint only what we write. Generated code is Scalar's responsibility and gets replaced
# on every import, so linting it produces noise nobody can act on.
include = [
  "src/arina_document_intelligence/lib/**/*.py",
  "tests/test_*.py",
  "tests/conftest.py",
  "scripts/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
